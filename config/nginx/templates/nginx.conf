server {
    listen SYSTEM_HTTP_PORT;
    server_name nar-builder.localhost;

    # Agents on the stack network reach this; a browser on the host or the LAN
    # does not. The proxy port is published on every host interface, and a
    # text/plain POST needs no CORS preflight, so any page the operator had open
    # could start a build. Blocker 6 of the 2026-09-28 review.
    # The gateway first, and that is what makes the allow-list mean anything.
    #
    # On rootless Docker every request through the published proxy port arrives
    # with $remote_addr set to the bridge gateway -- measured 2026-10-01 by the
    # reviewer and again here: a request to 127.0.0.1 and one to the host's LAN
    # address both logged the gateway, which is *inside* SYSTEM_NETWORK_SUBNET.
    # So "allow the stack network" allowed the whole LAN, and any client that
    # sent `X-Liquid-Agent: 1` could start a build of any path under /repos.
    # S3 of the 2026-10-01 review.
    #
    # An agent is not affected: it posts to proxy:8888 from inside its own
    # container, so its address comes from SYSTEM_NETWORK_POOL and not from the
    # gateway. Nothing legitimate arrives as the gateway.
    deny SYSTEM_NETWORK_GATEWAY;
    allow SYSTEM_NETWORK_SUBNET;
    deny all;

    location / {
        proxy_pass http://nar_builder:8770;
        proxy_set_header Host "nar-builder.localhost:SYSTEM_HTTP_PORT";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 0;
    }
}

# OpenClaw gateway/dashboard. The gateway is a long-lived WebSocket server, so
# Upgrade/Connection + extended read/send timeouts are required (OpenClaw's own
# nginx guidance: never expose 18789 directly, proxy it with WS support). The
# openclaw-gateway service no longer publishes ports — it is reachable only
# through these blocks. Bound by name, which nginx resolves at startup, so the
# openclaw-gateway service must be up (it is enabled, unlike hermes).
#
# Auth is delegated to this proxy (gateway.auth.mode = trusted-proxy in
# openclaw.json). X-Forwarded-User is the identity the gateway trusts, so the
# browser needs no token/password — same pattern as pgAdmin/OpenProject/Nextcloud
# above. The gateway only accepts this header from trusted proxy IPs
# (gateway.trustedProxies), which is why it must never publish host ports.
server {
    listen SYSTEM_HTTP_PORT;
    server_name openclaw.localhost;

    location / {
        proxy_pass http://openclaw-gateway:18789;
        proxy_set_header Host "openclaw.localhost:SYSTEM_HTTP_PORT";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User "user@nocodenation.org";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_http_version 1.1;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        client_max_body_size 0;
    }
}

# OpenClaw node bridge (remote nodes / CLIs connect here over WebSocket).
